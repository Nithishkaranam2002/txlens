name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image as the local stack. Throwaway CI-only credentials, not a secret.
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: txlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: txlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txlens -d txlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://txlens:ci-only-password@localhost:5432/txlens
      # Fail (not skip) the database tests if Postgres is unreachable.
      TXLENS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.7.22"
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Delta Lake jars that Spark downloads through Ivy on first start (versions pinned by uv.lock).
      - uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Tesseract (document OCR tests; Docling is opt-in and not installed here)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies (including PySpark)
        run: uv sync --frozen --all-packages --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          # One mypy run per package: each tests/ folder has its own conftest.py.
          for pkg in backend data_generator pipelines evals omop; do uv run mypy "$pkg" || exit 1; done
      - name: Test (without the slow Spark runs and the R parity job's tests)
        run: uv run pytest -m "not slow and not r"
      - name: OpenAPI schema is up to date (run `make openapi` after API changes)
        run: |
          uv run txlens-export-openapi > frontend/openapi.json
          git diff --exit-code frontend/openapi.json

  # The Python survival port against the R reference (r_parity/), R run in its Docker image.
  r-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: txlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: txlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txlens -d txlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://txlens:ci-only-password@localhost:5432/txlens
      TXLENS_REQUIRE_DB: "1"
      # Fail (not skip) if the R image is missing.
      TXLENS_REQUIRE_R: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.7.22"
          enable-cache: true
      - name: Build the R image (pinned R 4.4.2, dated CRAN snapshot)
        run: docker build -f infra/r.Dockerfile -t txlens-r:local infra
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: R vs Python parity
        run: uv run pytest -m r

  # End-to-end Spark runs on generated data (about 25 minutes). Only on main and by hand, so
  # pull requests get quick feedback from the job above.
  pipelines-e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.7.22"
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies (including PySpark)
        run: uv sync --frozen --all-packages --all-extras
      - name: Slow Spark tests
        run: uv run pytest -m slow

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typed API client matches openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Browser tests against the real API on a seeded throwaway database (no Spark needed).
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: txlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: txlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txlens -d txlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://txlens:ci-only-password@localhost:5432/txlens
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.7.22"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
