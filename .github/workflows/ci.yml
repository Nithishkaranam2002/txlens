name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # Same image as the local stack. Throwaway CI-only credentials, not a secret.
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: txlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: txlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U txlens -d txlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://txlens:ci-only-password@localhost:5432/txlens
      # Fail (not skip) the database tests if Postgres is unreachable.
      TXLENS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.7.22"
          enable-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies (including PySpark)
        run: uv sync --frozen --all-packages --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          # One mypy run per package: each tests/ folder has its own conftest.py.
          for pkg in backend data_generator pipelines evals omop; do uv run mypy "$pkg" || exit 1; done
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
