# Workspace root: holds shared tool settings and dev tools.
# Each folder listed in `members` is its own Python package.
[tool.uv.workspace]
members = ["backend", "data_generator", "pipelines", "evals", "omop"]

[tool.uv.sources]
txlens-backend = { workspace = true }
txlens-datagen = { workspace = true }
txlens-pipelines = { workspace = true }
txlens-evals = { workspace = true }
txlens-omop = { workspace = true }

[tool.uv]
# importlib-metadata 10.2 (released 2026-11-09) added an unverified new dependency
# ("lazy-importer": no author, no source link). Stay on the established 9.x line.
# Releases younger than two weeks are not taken (supply-chain safety). These caps hold back
# transitive dependencies of litellm/instructor whose newest release was days old when added
# (2026-11-11); lift them once those releases have aged.
constraint-dependencies = [
    "importlib-metadata<10",
    "boto3<=1.43.120",
    "botocore<=1.43.120",
    "hf-xet<=1.7.0",
    "markdown-it-py<4.3",
    "regex<2026.11",
    "typer<0.28",
    # medspaCy (Step 2.2, added 2026-11-11): these releases were under two weeks old
    "smart-open<=9.0.0",
    "srsly<=2.5.5",
    "loguru<0.8",
    # Step 3.3 copilot (added 2026-11-12): newest releases at least two weeks old
    "langgraph<=1.2.18",
    "langchain-core<=1.7.1",
    "langsmith<=0.14.14",
    "langgraph-sdk<=0.4.10",
    "langchain-protocol<=0.0.20",
    "jsonpatch<=1.38",
    "jsonpointer<=3.6",
    "xxhash<=4.0.2",
    "ormsgpack<=1.13.0",
    "sqlglot<=30.25.0",
    "datasets<=5.1.0",  # via ragas (evals only)
    "langchain-community<0.4.2",  # ragas 0.4.3 imports chat_models.vertexai, removed in 0.4.2
    # docling group
    "torch<=2.14.1",
    "torchvision<=0.29.1",
    "docling-parse<=7.24.0",
    "cuda-bindings<=13.4.4",
    "cuda-pathfinder<=1.8.4",
    "doclang<=0.8.0",
    "docling-core<=2.105.0",
    "faker<=40.43.0",
    "mail-parser<=4.8.0",
    "nvidia-nvjitlink<=13.4.92",
    "pypdfium2<=5.14.0",
    "soupsieve<=3.0.4",
    "transformers<=5.21.0",
    "tree-sitter<=0.26.0",
    "xlsxwriter<=3.3.0",
    # pandas-stubs (Step 3.1, added 2026-11-12): its types-pytz dependency was 12 days old
    "types-pytz<2026.6.0.20261031",
    # Step 3.2 risk model (added 2026-11-12): newest releases at least two weeks old
    "mlflow-skinny<=3.17.2",
    "cachetools<=7.2.7",
    "databricks-sdk<=0.157.0",
    "google-auth<=2.62.0",
    "opentelemetry-proto<=1.45.1",
    "opentelemetry-sdk<=1.45.1",
    "opentelemetry-semantic-conventions<=0.66b1",
    "sqlparse<=0.6.0",
    "threadpoolctl<=3.7.0",
]

[dependency-groups]
dev = [
    "txlens-backend",
    "txlens-datagen",
    "txlens-pipelines",
    "txlens-evals",
    "txlens-omop",
    "ruff>=0.12",
    "mypy>=1.17",
    "pytest>=8.4",
    "httpx>=0.28",
    "httpx2>=2.16",  # Starlette's TestClient uses it once installed (langsmith brings it)
    "types-pyyaml>=6.0,<6.0.12.20261001",
    "pandas-stubs>=2.2,<2.4",
]
# Opt-in (pulls in PyTorch and layout models, ~1-2 GB): `uv sync --all-packages --group docling`.
# Without it, document OCR uses Tesseract directly. CI does not install it.
docling = ["docling>=2.140,<=2.143.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `functions as F` is the standard PySpark idiom.
"pipelines/**" = ["N812"]
"evals/**" = ["N812"]
# Databricks notebooks: `spark`, `dbutils` and `displayHTML` are globals there, and imports
# follow the %pip / %run cells.
"pipelines/databricks/notebooks/*" = ["E402", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["txlens_backend", "txlens_datagen", "txlens_pipelines", "txlens_evals", "txlens_omop"]

[tool.mypy]
python_version = "3.12"
strict = true
# Databricks notebooks use its globals (spark, dbutils); a test checks they parse.
exclude = ["pipelines/databricks/notebooks/"]
mypy_path = [
    "backend/src",
    "data_generator/src",
    "pipelines/src",
    "evals/src",
    "omop/src",
    "data_generator/tests",
    "pipelines/tests",
    "backend/tests",
]
explicit_package_bases = true

# PySpark (and pandera, which the pipelines use with it) is only installed inside the Spark
# container and in CI.
[[tool.mypy.overrides]]
# docling is an opt-in group (absent in CI); pytesseract, langfuse 2.x and medspaCy ship no
# type information; nor do lifelines, reportlab and scipy (without scipy-stubs).
module = ["pyspark.*", "delta.*", "pandera.*", "docling.*", "docling_core.*", "pytesseract.*",
          "langfuse.*", "medspacy.*", "lifelines.*", "reportlab.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["backend/tests", "data_generator/tests", "evals/tests", "omop/tests", "pipelines/tests",
             "r_parity/tests"]
# Shared test helpers (uniquely named so they cannot clash with other packages).
pythonpath = ["data_generator/tests", "backend/tests", "pipelines/tests"]
markers = [
    "spark: needs PySpark + Java (runs in the Spark container or CI)",
    "db: needs PostgreSQL (local `make up`, or the CI service)",
    "slow: minutes-long Spark runs; CI runs them in their own job (`pytest -m slow`)",
    "r: R parity (Docker image txlens-r:local, `make r-build`); CI job r-parity (`pytest -m r`)",
]
