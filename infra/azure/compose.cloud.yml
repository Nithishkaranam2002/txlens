# Cloud demo (Azure VM): used together with infra/docker-compose.yml, as
#   docker compose -f infra/docker-compose.yml -f infra/azure/compose.cloud.yml ...
# (infra/demo/common.sh does this when TXLENS_COMPOSE_OVERRIDE is set). Relative paths are
# relative to infra/, the first file's folder.
#
# Caddy is the only service with public ports. Everything else stays on 127.0.0.1 of the VM
# (and the Azure NSG and ufw block those ports anyway). No OpenAI key: LLM answers come from
# the cache only, so nobody can spend money through the demo. Langfuse, MLflow UI and Spark
# are never started here.

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    volumes:
      # No Langfuse database in the cloud: this replaces the script that creates it.
      - ./azure/no-langfuse-db.sh:/docker-entrypoint-initdb.d/init-langfuse-db.sh:ro

  temporal:
    <<: *restart

  api:
    <<: *restart
    environment: &cloud-backend-env
      OPENAI_API_KEY: ""
      COOKIE_SECURE: "true"
      FRONTEND_ORIGIN: https://${TXLENS_DOMAIN:?set TXLENS_DOMAIN in .env}

  worker:
    <<: *restart
    environment: *cloud-backend-env

  tools:
    environment: *cloud-backend-env

  web:
    <<: *restart
    environment:
      # HSTS and upgrade-insecure-requests in the pages' headers (frontend/src/proxy.ts).
      TXLENS_HSTS: "1"

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["demo"]
    <<: *restart
    depends_on:
      web:
        condition: service_healthy
    environment:
      TXLENS_DOMAIN: ${TXLENS_DOMAIN:?set TXLENS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./azure/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts and redeploys (no new certificate on every start).
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy-data:
  caddy-config:
