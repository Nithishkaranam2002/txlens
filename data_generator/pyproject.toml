[project]
name = "txlens-datagen"
version = "0.1.0"
description = "Synthetic transplant patient data generator"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
txlens-generate = "txlens_datagen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlens_datagen"]
