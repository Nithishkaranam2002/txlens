[project]
name = "txlens-omop"
version = "0.1.0"
description = "OMOP CDM v5.4 DDL, vocabulary loading and code checks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "txlens-datagen",
]

[project.scripts]
txlens-vocab = "txlens_omop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlens_omop"]

[tool.uv.sources]
txlens-datagen = { workspace = true }
