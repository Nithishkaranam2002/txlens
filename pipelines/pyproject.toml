[project]
name = "txlens-pipelines"
version = "0.1.0"
description = "PySpark + Delta Lake medallion pipelines (bronze -> silver -> gold)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Heavy (~350 MB) and needs Java: installed only in the Spark container and CI.
spark = ["pyspark>=3.5.5,<3.6", "delta-spark>=3.3,<3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlens_pipelines"]
