[project]
name = "txlens-backend"
version = "0.1.0"
description = "TxLens FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "txlens-datagen",
    "txlens-omop",
]

[project.scripts]
txlens-db-setup = "txlens_backend.db_setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlens_backend"]

[tool.uv.sources]
txlens-datagen = { workspace = true }
txlens-omop = { workspace = true }
