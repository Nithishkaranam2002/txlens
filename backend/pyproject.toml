[project]
name = "txlens-backend"
version = "0.1.0"
description = "TxLens FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlens_backend"]
