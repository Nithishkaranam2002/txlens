[project]
name = "txlens-backend"
version = "0.1.0"
description = "TxLens FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "instructor>=1.17,<2",
    "langfuse>=2.60,<3",
    "lifelines>=0.30",
    "litellm==1.106.5",
    "matplotlib>=3.9",
    "medspacy==1.3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "pymupdf>=1.28,<2",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "reportlab>=4.2",
    "sqlalchemy>=2.0",
    "sqlglot>=30.31.0",
    "temporalio>=1.9,<1.36",
    "txlens-datagen",
    "txlens-omop",
    "txlens-pipelines",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
txlens-db-setup = "txlens_backend.db_setup:main"
txlens-seed-users = "txlens_backend.seed_users:main"
txlens-prune-login-attempts = "txlens_backend.maintenance:main"
txlens-worker = "txlens_backend.workflows.cli:worker_main"
txlens-surveillance = "txlens_backend.workflows.cli:main"
txlens-biopsies = "txlens_backend.workflows.biopsy_cli:main"
txlens-notes = "txlens_backend.workflows.notes_cli:main"
txlens-export-openapi = "txlens_backend.api.app:export_openapi"
txlens-literature = "txlens_backend.copilot.literature:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txlens_backend"]

[tool.uv.sources]
txlens-datagen = { workspace = true }
txlens-omop = { workspace = true }
txlens-pipelines = { workspace = true }
